services:
  - type: web
    name: driftshield-backend
    runtime: docker
    dockerContext: ./backend/backend
    dockerfilePath: ./backend/backend/Dockerfile
    plan: free

    envVars:
      - key: PORT
        value: 8080

      - key: DB_HOST
        fromDatabase:
          name: driftshield-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: driftshield-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: driftshield-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: driftshield-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: driftshield-db
          property: password

      - key: CORS_ALLOWED_ORIGINS
        value: https://driftshield-frontend.onrender.com

  - type: web
    name: driftshield-frontend
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free

    envVars:
      - key: VITE_API_BASE_URL
        value: https://driftshield-backend.onrender.com

databases:
  - name: driftshield-db
    databaseName: driftshield
    user: driftshield
    plan: free
