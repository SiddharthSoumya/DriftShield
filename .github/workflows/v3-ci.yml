name: DriftShield v3
on:
  pull_request:
  push:
    branches: [main, driftshield-v3]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: driftshield
          POSTGRES_USER: driftshield
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U driftshield"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DS_DEV: '1'
      DS_DB_NAME: driftshield
      DS_DB_USER: driftshield
      DS_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit installed application dependencies
        run: |
          python -m venv .audit
          .audit/bin/python -m pip install pip-audit==2.10.1
          .audit/bin/python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 2
      - run: python -m compileall -q driftshield governance collector infrastructure
      - run: for script in deploy/install.sh deploy/driftshieldctl deploy/service-launch deploy/pilot-acceptance; do bash -n "$script"; done
      - name: Check production settings
        env:
          DS_DEV: '0'
          DS_ORIGIN: https://driftshield.example.test
          DS_SECRET_KEY: ci-only-8c7a5ebbf750b061d62962048e4ea06c126f75468c40f03f3fd0d4dc
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --no-input
      - name: Install and upgrade systemd services
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$(command -v python)"
          sudo env DRIFTSHIELD_PYTHON="$python_bin" bash deploy/install.sh
          sudo sed -i 's|^DS_ORIGIN=.*|DS_ORIGIN=https://driftshield.example.test|; s|^DS_DB_PASSWORD=.*|DS_DB_PASSWORD=ci-only-password|' /etc/driftshield/service.env
          sudo env DRIFTSHIELD_PYTHON="$python_bin" bash deploy/install.sh
          sudo systemd-analyze verify /etc/systemd/system/driftshield-web.service /etc/systemd/system/driftshield-worker.service
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/healthz
          previous="$(readlink /opt/driftshield/current)"
          sudo env DRIFTSHIELD_PYTHON="$python_bin" bash deploy/install.sh
          test "$(readlink /opt/driftshield/current)" != "$previous"
          sudo systemctl is-active driftshield-web driftshield-worker
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/healthz
          for attempt in {1..10}; do
            if sudo driftshieldctl shell -c 'from governance.models import WorkerHealth; assert WorkerHealth.objects.filter(name="worker").exists()'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: sudo journalctl -u driftshield-web -u driftshield-worker -n 80 --no-pager
      - name: Smoke-test installed infrastructure ingestion
        shell: bash
        run: |
          set -euo pipefail
          token="$(sudo driftshieldctl shell -c 'from datetime import timedelta; from django.utils import timezone; from governance.models import Workspace; from infrastructure.domain import issue_token; from infrastructure.models import Target; w=Workspace.objects.create(slug="ci-infra",name="Infrastructure CI"); token,hashed=issue_token(); Target.objects.create(workspace=w,name="billing",platform="snapshot",scope="billing",token_hash=hashed,token_expires_at=timezone.now()+timedelta(days=1)); print(token)' | tail -1)"
          target="$(sudo driftshieldctl shell -c 'from infrastructure.models import Target; print(Target.objects.get(name="billing").pk)' | tail -1)"
          snapshot="$(mktemp)"
          report="$(mktemp)"
          trap 'rm -f "$snapshot" "$report"' EXIT
          printf '%s\n' '{"billing/api":{"replicas":2}}' > "$snapshot"
          python -m collector snapshot --scope billing --file "$snapshot" --preview > "$report"
          for attempt in 1 2; do
            curl -fsS http://127.0.0.1:8000/api/v1/infrastructure/"$target"/observations/ \
              -H 'Host: driftshield.example.test' -H 'X-Forwarded-Proto: https' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @"$report" |
              python -c 'import json, sys; assert json.load(sys.stdin)["status"] == "unbaselined"'
          done
          sudo driftshieldctl shell -c 'from infrastructure.models import Target, Delivery; assert Target.objects.get(name="billing").revision == 1; assert Delivery.objects.count() == 1'
      - name: Verify the pilot migration on a separate legacy schema
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U driftshield driftshield_pilot_upgrade
          export DS_DB_NAME=driftshield_pilot_upgrade
          python manage.py migrate governance 0004 --no-input
          python manage.py migrate infrastructure 0006 --no-input
          python manage.py shell -c 'from django.db import connection; c=connection.cursor(); c.execute("INSERT INTO governance_workspace (slug, name, recipient, retention_days, repo_limit, require_private, min_reviews, digest_weekly, last_digest_week, require_signatures, infra_high_priority_only) VALUES (%s, %s, %s, 90, 25, false, 0, false, %s, false, false)", ["upgrade", "Legacy upgrade", "", ""]); c.execute("INSERT INTO infrastructure_target (workspace_id, name, platform, scope, token_hash, interval, created_at, revision, version, latest, last_error, overdue_alerted, source_id, runbook_url) SELECT id, %s, %s, %s, %s, 30, now(), 0, 0, %s, %s, false, %s, %s FROM governance_workspace WHERE slug=%s", ["old", "snapshot", "scope", "", "{}", "", "", "", "upgrade"])'
          python manage.py migrate --no-input
          python manage.py shell -c 'from infrastructure.models import Target; t=Target.objects.get(name="old"); assert t.profile == "legacy" and t.last_complete_delivery_id is None; t.delete()'
      - name: Verify the installed pilot health and intake fence
        shell: bash
        run: |
          set -euo pipefail
          sudo cp -p /etc/driftshield/service.env /etc/driftshield/service.env.ci
          restore() {
            sudo mv /etc/driftshield/service.env.ci /etc/driftshield/service.env
            sudo systemctl restart driftshield-web driftshield-worker
          }
          trap restore EXIT
          probe="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf '%s\n' DS_DB_NAME=driftshield_pilot_upgrade DS_PILOT_EBS=1 DS_PILOT_WORKSPACE=upgrade \
            DS_PILOT_RECOVERY_FENCED=1 "DS_PILOT_PROBE_TOKEN=$probe" | sudo tee -a /etc/driftshield/service.env >/dev/null
          sudo systemctl stop driftshield-worker
          sudo systemctl restart driftshield-web
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8000/livez
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Host: driftshield.example.test' -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8000/internal/pilot/healthz)" = 401
          body="$(mktemp)"
          test "$(curl -sS -o "$body" -w '%{http_code}' \
            -H 'Host: driftshield.example.test' -H 'X-Forwarded-Proto: https' \
            -H "Authorization: Bearer $probe" http://127.0.0.1:8000/internal/pilot/healthz)" = 503
          python -c 'import json, sys; assert json.load(open(sys.argv[1]))["status"] == "recovery_fenced"' "$body"
          rm -f "$body"
      - name: Verify database outage and backup recovery
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          trap 'rm -f "$backup"' EXIT
          docker exec "$PG_CONTAINER" pg_dump -U driftshield -Fc driftshield > "$backup"
          docker exec "$PG_CONTAINER" createdb -U driftshield driftshield_restore
          docker exec -i "$PG_CONTAINER" pg_restore -U driftshield --exit-on-error -d driftshield_restore < "$backup"
          DS_DB_NAME=driftshield_restore python manage.py shell -c 'from infrastructure.models import Delivery, Target; assert Target.objects.get(name="billing").revision == 1; assert Delivery.objects.count() == 1'
          docker stop "$PG_CONTAINER"
          curl -fsS --max-time 10 http://127.0.0.1:8000/livez
          test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz)" = 503
          docker start "$PG_CONTAINER"
          curl --retry 15 --retry-all-errors --retry-delay 1 --max-time 10 -fsS http://127.0.0.1:8000/healthz
  collector-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        engine: [terraform, tofu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: matrix.engine == 'terraform'
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        if: matrix.engine == 'tofu'
        with:
          tofu_version: '1.9.1'
          tofu_wrapper: false
      - name: Collect a real refresh-only plan
        shell: bash
        env:
          IAC_CLI: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s\n' 'resource "terraform_data" "demo" { input = "approved" }' > "$work/main.tf"
          "$IAC_CLI" -chdir="$work" init -input=false
          "$IAC_CLI" -chdir="$work" apply -input=false -auto-approve
          "$IAC_CLI" -chdir="$work" plan -refresh-only -input=false -out=plan
          "$IAC_CLI" -chdir="$work" show -json plan > "$work/plan.json"
          python -m collector terraform --scope local-ci --file "$work/plan.json" --preview |
            python -c 'import json, sys; assert json.load(sys.stdin)["resources"] == {}'
      - name: Collect a real Docker configuration change
        if: matrix.engine == 'terraform'
        shell: bash
        run: |
          set -euo pipefail
          docker create --name driftshield-ci --memory 128m busybox:1.37
          trap 'docker rm -f driftshield-ci' EXIT
          inspect() {
            python -m collector docker --scope ci --context default --container driftshield-ci --preview
          }
          inspect | python -c 'import json, sys; assert json.load(sys.stdin)["resources"]["container/driftshield-ci"]["memory_bytes"] == 134217728'
          docker update --memory 256m driftshield-ci
          inspect | python -c 'import json, sys; assert json.load(sys.stdin)["resources"]["container/driftshield-ci"]["memory_bytes"] == 268435456'
  kubernetes-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: driftshield-ci
      - name: Collect a real deployment and service change
        shell: bash
        run: |
          set -euo pipefail
          context=kind-driftshield-ci
          kubectl --context "$context" create namespace driftshield
          kubectl --context "$context" -n driftshield create deployment billing --image=nginx:1.27
          kubectl --context "$context" -n driftshield expose deployment billing --port=80
          collect() {
            python -m collector kubernetes --scope ci:driftshield --context "$context" --namespace driftshield --preview
          }
          collect | python -c 'import json, sys; r=json.load(sys.stdin)["resources"]; assert r["deployment/driftshield/billing"]["replicas"] == 1; assert r["service/driftshield/billing"]["service_type"] == "ClusterIP"'
          kubectl --context "$context" -n driftshield scale deployment billing --replicas=2
          collect | python -c 'import json, sys; assert json.load(sys.stdin)["resources"]["deployment/driftshield/billing"]["replicas"] == 2'
