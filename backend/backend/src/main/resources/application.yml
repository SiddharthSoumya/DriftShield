spring:
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:h2:mem:driftshield;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
    username: ${DB_USERNAME:${DB_USER:sa}}
    password: ${DB_PASSWORD:${DB_PASS:}}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

logging:
  level:
    org.hibernate.SQL: OFF

server:
  port: ${PORT:8080}
