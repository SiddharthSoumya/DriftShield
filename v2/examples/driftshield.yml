name: DriftShield configuration scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: driftshield
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      DRIFTSHIELD_TOKEN: ${{ secrets.DRIFTSHIELD_TOKEN }}
      DRIFTSHIELD_INGEST_URL: ${{ vars.DRIFTSHIELD_INGEST_URL }}
    steps:
      - name: Collect and submit selected repository settings
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          url = os.environ["DRIFTSHIELD_INGEST_URL"]
          token = os.environ["DRIFTSHIELD_TOKEN"]
          destination = urlsplit(url)
          if destination.scheme != "https" or not destination.hostname or destination.username or not token:
              raise SystemExit("Set a valid HTTPS ingest URL and runner token.")

          opener = build_opener(NoRedirect())
          observed_at = datetime.now(timezone.utc).isoformat()
          payload = {
              "delivery_id": os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_at": observed_at,
              "repository": os.environ["GITHUB_REPOSITORY"],
          }
          api_request = Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"],
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with opener.open(api_request, timeout=10) as response:
                  metadata = json.load(response)
              fields = ("id", "visibility", "default_branch", "archived", "has_issues", "has_wiki")
              payload["metadata"] = {key: metadata.get(key) for key in fields}
          except HTTPError as error:
              payload["error"] = "repository_unavailable" if error.code in (301, 302, 307, 308, 404) else "github_api_error"
          except (URLError, OSError, ValueError):
              payload["error"] = "github_api_error"

          push = Request(url, data=json.dumps(payload).encode(), headers={
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
          })
          for attempt in range(3):
              try:
                  with opener.open(push, timeout=10) as response:
                      status = json.load(response)["status"]
                  break
              except HTTPError as error:
                  if error.code < 500 or attempt == 2:
                      raise SystemExit(f"DriftShield rejected the delivery (HTTP {error.code}).") from None
              except (URLError, OSError):
                  if attempt == 2:
                      raise SystemExit("DriftShield could not be reached.") from None
              time.sleep(2 ** attempt)
          print("DriftShield scan:", status)
          if status == "error":
              raise SystemExit(1)
          PY
